# Combined Docker Compose for Graphiti MCP + REST Server with FalkorDB
# Usage: docker compose -f docker-compose-combined.yml up --build

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    environment:
      - FALKORDB_ARGS=--port 6379 --cluster-enabled no
      - BROWSER=${BROWSER:-1}
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s

  graphiti-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - PATH=/root/.local/bin:${PATH}
    volumes:
      - ./config/config-docker-ollama.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "8000:8000"
    command: ["uv", "run", "main.py"]

  graphiti-rest:
    build:
      context: ../server
      dockerfile: ../mcp_server/docker/Dockerfile.rest
    env_file:
      - path: ../.env
        required: false
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_BASE_URL=${OLLAMA_API_URL:-http://localhost:11434/v1}
      - MODEL_NAME=${OLLAMA_MODEL:-gemma3:12b}
      - EMBEDDING_MODEL_NAME=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIM=${OLLAMA_EMBEDDING_DIM:-768}
      - FALKORDB_HOST={FALKORDB_HOST:-localhost}
      # - FALKORDB_PASSWORD={FALKORDB_PASSWORD:-demo}
      - FALKORDB_URI=redis://falkordb:6379
      - FALKORDB_DATABASE=default_db
      - GRAPHITI_BACKEND=falkordb
      - PORT=8001
      - database_provider=falkordb
    ports:
      - "8001:8000"
    command: ["uv", "run", "python", "-m", "graph_service.main"]

volumes:
  falkordb_data:
    driver: local
